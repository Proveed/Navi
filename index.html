<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAVI | OS TOTAL CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #fff; color: #000; overflow: hidden; touch-action: manipulation; }
        .bg-magenta { background-color: #FF00FF; }
        .text-magenta { color: #FF00FF; }
        .rounded-yao { border-radius: 30px; }
        .hidden { display: none !important; }

        /* Categorías Grid */
        .category-card { transition: all 0.2s; cursor: pointer; border: 1.5px solid #f3f4f6; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; border-radius: 25px; }
        .category-card:active { scale: 0.95; border-color: #FF00FF; }
        .category-card span { font-weight: 900; font-size: 7px; text-transform: uppercase; color: #999; margin-top: 4px; }

        /* Editor de Código */
        .code-container { display: flex; background: #000; color: #A3FF00; font-family: 'Fira Code', monospace; font-size: 11px; height: 100%; overflow: hidden; }
        .line-numbers { padding: 15px 8px; border-right: 1px solid #222; background: #050505; color: #444; text-align: right; min-width: 35px; user-select: none; line-height: 1.6; }
        #codeEditor { flex: 1; background: transparent; border: none; outline: none; padding: 15px; color: #A3FF00; resize: none; white-space: pre; overflow-x: auto; line-height: 1.6; }

        /* Admin UI */
        .admin-input { border: 2px solid #eee; border-radius: 15px; padding: 12px; font-weight: 700; outline: none; font-size: 12px; width: 100%; background: #f9f9f9; }
        .admin-input:focus { border-color: #FF00FF; background: #fff; }

        /* Animaciones */
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .navi-pulse { animation: pulse-magenta 2s infinite; border: 4px solid #FF00FF; }
        @keyframes pulse-magenta {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 255, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 255, 0); }
        }

        /* Botón de Enviar Rayo Pro */
        .btn-send-navi { background: #000; color: #A3FF00; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #A3FF00; box-shadow: 0 0 10px rgba(163, 255, 0, 0.4); transition: all 0.2s; flex-shrink: 0; cursor: pointer; }
        .btn-send-navi:active { transform: scale(0.9); }
    </style>
</head>
<body class="antialiased">

    <div id="secretZone" class="fixed top-0 left-0 w-16 h-16 z-[9999]"></div>

    <section id="loginScreen" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-[5000] bg-white">
        <div class="w-20 h-20 bg-black rounded-full flex items-center justify-center text-magenta font-black text-xl mb-10 navi-pulse">NAVI</div>
        <div class="w-full max-w-xs space-y-4">
            <input type="password" id="pinAcceso" maxlength="4" placeholder="PIN" class="text-3xl tracking-[0.3em] text-center bg-gray-50 border-2 rounded-2xl p-4 w-full outline-none">
            <button onclick="validarEntrada()" class="w-full bg-black text-white py-5 rounded-full font-black text-[10px] uppercase border-2 border-magenta">Entrar</button>
        </div>
    </section>

    <main id="mainHub" class="hidden min-h-screen p-6 bg-gray-50 overflow-y-auto">
        <header class="mb-8 mt-4"><h1 class="text-5xl font-black italic tracking-tighter uppercase">NAVI</h1></header>
        <div class="grid grid-cols-2 gap-3 pb-32">
            <div onclick="abrirChat('E-Commerce')" class="category-card"><i class="fas fa-store text-orange-500 text-xl"></i><span>E-Commerce</span></div>
            <div onclick="abrirChat('Inventarios')" class="category-card"><i class="fas fa-boxes text-green-500 text-xl"></i><span>Inventarios</span></div>
            <div onclick="abrirChat('Gaming')" class="category-card"><i class="fas fa-gamepad text-blue-500 text-xl"></i><span>Gaming</span></div>
            <div onclick="abrirChat('Seguridad')" class="category-card"><i class="fas fa-shield-alt text-magenta text-xl"></i><span>Seguridad</span></div>
            <div onclick="abrirChat('Marketing')" class="category-card"><i class="fas fa-bullhorn text-purple-500 text-xl"></i><span>Marketing</span></div>
            <div onclick="abrirChat('Logística')" class="category-card"><i class="fas fa-truck-fast text-yellow-600 text-xl"></i><span>Logística</span></div>
            <div onclick="abrirChat('Inteligencia')" class="category-card"><i class="fas fa-brain text-cyan-600 text-xl"></i><span>Data AI</span></div>
            <div onclick="abrirChat('B2B')" class="category-card"><i class="fas fa-handshake text-black text-xl"></i><span>B2B Network</span></div>
        </div>
    </main>

    <div id="chatInterface" class="hidden fixed inset-0 bg-white z-[4000] flex flex-col">
        <header class="p-4 bg-black text-white flex justify-between items-center shadow-lg">
            <div class="flex-1 flex justify-center gap-10">
                <button onclick="switchTab('tab-chat')" id="nav-chat" class="text-xl text-magenta border-b-2 border-magenta pb-1"><i class="fas fa-comment-dots"></i></button>
                <button onclick="switchTab('tab-code')" id="nav-code" class="text-xl text-gray-500"><i class="fas fa-code"></i></button>
                <button onclick="switchTab('tab-view')" id="nav-view" class="text-xl text-gray-500"><i class="fas fa-eye"></i></button>
            </div>
            <button onclick="cerrarChat()" class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center border border-magenta"><i class="fas fa-times text-magenta"></i></button>
        </header>
        
        <div class="flex-1 relative bg-gray-50 overflow-hidden flex flex-col">
            <div id="tab-chat" class="absolute inset-0 flex flex-col">
                <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
                <div class="p-4 bg-white border-t-2">
                    <div class="flex items-center gap-3 bg-gray-100 rounded-3xl px-4 py-2 border-2 border-transparent focus-within:border-magenta">
                        <label class="p-2 text-gray-400"><i class="fas fa-paperclip text-xl"></i><input type="file" class="hidden"></label>
                        <input type="text" id="userInput" placeholder="Orden para Navi..." class="flex-1 bg-transparent py-3 text-sm font-bold text-black outline-none">
                        <button onclick="enviarMensaje()" class="btn-send-navi"><i class="fas fa-bolt"></i></button>
                    </div>
                </div>
            </div>

            <div id="tab-code" class="hidden absolute inset-0 flex flex-col bg-[#000]">
                <div class="code-container">
                    <div id="lineNumbers" class="line-numbers">1</div>
                    <textarea id="codeEditor" spellcheck="false" oninput="updateLineNumbers()" onscroll="syncScroll()">// Modo edición activado</textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="hidden fixed inset-0 bg-white z-[7000] overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6 border-b-2 border-magenta pb-4">
            <h1 class="text-xl font-black uppercase text-magenta">Navi Admin</h1>
            <button onclick="cerrarAdmin()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>
        <div class="bg-gray-100 p-5 rounded-yao mb-6 space-y-3">
            <input type="text" id="regNombre" placeholder="Nombre" class="admin-input">
            <input type="number" id="regPin" placeholder="PIN" class="admin-input">
            <button onclick="guardarUsuario()" class="w-full bg-black text-white py-4 rounded-full font-black text-[10px] uppercase border-2 border-magenta">Guardar</button>
        </div>
        <div id="listaUsuarios" class="space-y-2 pb-20"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmQG-rjYN9juqH0ljkc16M-Atf1oIz6K0",
            authDomain: "navi-9aa8e.firebaseapp.com",
            projectId: "navi-9aa8e",
            storageBucket: "navi-9aa8e.firebasestorage.app",
            messagingSenderId: "426383331380",
            appId: "1:426383331380:web:8d7671f506727282772584"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LÓGICA DEL CHAT ---
        window.enviarMensaje = () => {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const texto = input.value.trim();

            if (!texto) return;

            // Burbuja de Usuario
            const userDiv = document.createElement('div');
            userDiv.className = "flex justify-end mb-4";
            userDiv.innerHTML = `<div class="bg-black text-white p-4 rounded-t-2xl rounded-bl-2xl max-w-[85%] border-b-2 border-magenta text-xs font-bold shadow-lg">${texto}</div>`;
            chatBox.appendChild(userDiv);

            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Respuesta de NAVI
            setTimeout(() => {
                const naviDiv = document.createElement('div');
                naviDiv.className = "flex justify-start mb-4";
                naviDiv.innerHTML = `<div class="bg-white text-black p-4 rounded-t-2xl rounded-br-2xl max-w-[85%] border-l-4 border-magenta shadow-md text-xs font-medium">
                    <span class="text-[9px] font-black text-magenta block mb-1">NAVI SYSTEM</span>
                    Procesando requerimiento en tiempo real...
                </div>`;
                chatBox.appendChild(naviDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        };

        // Escuchar Enter
        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensaje(); });

        // --- NAVEGACIÓN ---
        window.switchTab = (id) => {
            ['tab-chat', 'tab-code'].forEach(t => {
                document.getElementById(t).classList.add('hidden');
                document.getElementById('nav-' + t.split('-')[1]).className = 'text-xl text-gray-500';
            });
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('nav-' + id.split('-')[1]).className = 'text-xl text-magenta border-b-2 border-magenta pb-1';
        };

        window.abrirChat = (cat) => {
            document.getElementById('chatInterface').classList.remove('hidden');
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `<p class="text-[10px] text-center text-gray-400 font-black uppercase mb-4 tracking-widest">--- Acceso a ${cat} ---</p>`;
        };
        window.cerrarChat = () => document.getElementById('chatInterface').classList.add('hidden');
        window.cerrarAdmin = () => document.getElementById('adminPanel').classList.add('hidden');

        // --- ADMIN & LOGIN ---
        window.validarEntrada = async () => {
            const pin = document.getElementById('pinAcceso').value;
            const q = query(collection(db, "usuarios_autorizados"), where("pin", "==", pin.toString()));
            const snap = await getDocs(q);
            if(!snap.empty) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainHub').classList.remove('hidden');
            } else { alert("ACCESO DENEGADO"); }
        };

        let cl = 0;
        document.getElementById('secretZone').onclick = () => {
            cl++; if(cl >= 4) { if(prompt("SISTEMA:") === "2132") document.getElementById('adminPanel').classList.remove('hidden'); cl=0; }
        };
    </script>
</body>
</html>
